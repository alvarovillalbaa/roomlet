# INACTIVE: publish the reviewed prep source first, then replace this immutable pin.
name: Temporary Roomlet native checks
on:
  create:
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'alvarovillalbaa/roomlet' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/roomlet-native-20261105' && github.ref == 'refs/heads/qa/roomlet-native-20261105'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: 0e8e02d7e9cf9a228c7d870b4a3ac7e3ace45373
      ROOMLET_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 1
          clean: false
      - name: Compile, check 29 authored cases and verify the local package
        shell: bash
        run: |
          set -euo pipefail
          python3 script/run_native_checks.py --source-commit "$SOURCE_COMMIT"
